name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 1. إنشاء ملفات نظام أندرويد
      - run: flutter create . --platforms=android

      # 2. 🚀 هذا الأمر يقوم بتغيير اسم التطبيق تلقائياً إلى Smart Wallet 🚀
      - run: |
          sed -i 's/android:label=".*"/android:label="Smart Wallet"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      
      # 3. تشغيل أداة الأيقونات التلقائية لتغيير شعار التطبيق
      - run: flutter pub run flutter_launcher_icons

      # 4. بناء نسخة نظامية رسمية وخفيفة (Release)
      - run: flutter build apk --release --split-per-abi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Wallet-APK
          path: build/app/outputs/flutter-apk/*-release.apk
